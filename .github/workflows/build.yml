name: Build Vale Herança Analyzer

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Verify Java
        run: java -version

      - name: Verify Gradle
        run: gradle --version

      - name: Clean project
        run: gradle clean

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ValeHerancaAnalyzer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
