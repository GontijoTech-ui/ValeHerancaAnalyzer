name: Build Vale Herança Analyzer

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Verify Java
        run: java -version

      - name: Verify Gradle
        run: gradle --version

      - name: Show Project Structure
        run: |
          echo "=============================="
          echo "PROJECT FILES"
          echo "=============================="
          find . -maxdepth 6 -type f | sort

      - name: Show Root Build
        run: |
          echo "=============================="
          echo "ROOT build.gradle.kts"
          echo "=============================="
          cat build.gradle.kts

      - name: Show App Build
        run: |
          echo "=============================="
          echo "APP build.gradle.kts"
          echo "=============================="
          cat app/build.gradle.kts

      - name: Show Settings
        run: |
          echo "=============================="
          echo "settings.gradle.kts"
          echo "=============================="
          cat settings.gradle.kts

      - name: Clean Project
        run: |
          gradle clean --stacktrace --info

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace --info

      - name: Check APK
        if: success()
        run: |
          echo "=============================="
          echo "APK GERADO:"
          echo "=============================="
          ls -lh app/build/outputs/apk/debug/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: ValeHerancaAnalyzer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
